<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Church or Weed?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Play the hilarious 'Church or Weed' game! Guess if images show churches or weed dispensaries. Test your observation skills and have fun in this unique, timed guessing game.">
  <meta name="theme-color" content="#14171f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div id="app" class="app">

    <div class="modal" id="rulesModal" aria-hidden="true">
      <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
        <h1 id="rulesTitle" class="modal__title">Church or Weed?</h1>
        <p class="modal__text">You've got <strong>5 seconds</strong> per image to guess which is which.</p>
        <p class="modal__text modal__text--muted">Answer within the first 2 seconds for bonus points.</p>
        <button class="btn btn--primary btn--block" id="startBtn">Start Game</button>
        <p class="modal__credit">Made with 🍻 by <a href="https://ethanthompson.org" target="_blank" rel="noopener">Ethan Thompson</a></p>
      </div>
    </div>

    <header class="hud">
      <div class="hud__stat">
        <span class="hud__label">Score</span>
        <span class="hud__value" id="scoreValue">0</span>
      </div>
      <div class="hud__progress" id="progressLabel">Round 1</div>
      <div class="hud__stat hud__stat--streak" id="streakStat" hidden>
        <span class="hud__label">Streak</span>
        <span class="hud__value" id="streakValue">0</span>
      </div>
    </header>

    <main class="stage">
      <div class="stage__timer" id="stageTimer">
        <div class="stage__timer-fill" id="timerFill"></div>
      </div>

      <div class="stage__image" id="stageImage"></div>
      <div class="stage__scrim"></div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <div class="options" id="options" aria-label="Your guess" hidden></div>

      <div class="panel" id="roundEndPanel" hidden>
        <h2 class="panel__title" id="roundEndTitle"></h2>
        <p class="panel__text" id="roundEndBody"></p>
        <button class="btn btn--primary btn--block" id="nextRoundBtn">Start Next Round</button>
      </div>

      <div class="panel" id="gameEndPanel" hidden>
        <h2 class="panel__title">That's all for now!</h2>
        <p class="panel__text" id="finalStats"></p>
        <a class="btn btn--secondary btn--block" id="submitLink" href="https://ethanthompson705282.typeform.com/to/ux1PUERb" target="_blank" rel="noopener">Submit a Church or Dispensary</a>
        <button class="btn btn--primary btn--block" id="playAgainBtn">Play Again</button>
      </div>
    </main>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
